# Supabase CLI configuration for local development (`supabase start`).
# Only values that differ from the CLI defaults are listed.
project_id = "hotzonex-cloud"

[api]
schemas = ["public"]

[db]
major_version = 15

[auth]
site_url = "http://localhost:5173"
# Password-reset links come back to /reset-password on the address they were asked from.
# Live project (Dashboard → Authentication → URL Configuration): Site URL https://app.hotzonex.net,
# Redirect URLs https://app.hotzonex.net/** and https://hotzonex-cloud-rum4d.ondigitalocean.app/**.
additional_redirect_urls = ["http://localhost:5173/**"]
# Staff accounts are created by admins only; nobody can sign themselves up.
enable_signup = false

[auth.email]
enable_signup = false
enable_confirmations = false

# add-router and create-staff require a logged-in user; they then check the caller is an active admin.
[functions.add-router]
verify_jwt = true

[functions.create-staff]
verify_jwt = true

# Called by the MikroTik routers themselves, which have no user login: each router
# authenticates with the token from its setup script (checked inside the function).
[functions.router-gateway]
verify_jwt = false

# Woken by the database (pg_net) for routers connected by IP address; it checks the
# x-hzc-worker secret from app_config itself.
[functions.router-direct]
verify_jwt = false

# Login-portal pages, downloaded by the routers themselves (no user login; public page content only).
[functions.portal]
verify_jwt = false

[functions.tunnel]
verify_jwt = false

[functions.delete-items]
verify_jwt = true
