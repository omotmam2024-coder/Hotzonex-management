# Supabase CLI configuration for local development (`supabase start`).
# Only values that differ from the CLI defaults are listed.
project_id = "hotzonex-cloud"

[api]
schemas = ["public"]

[db]
major_version = 17

[auth]
site_url = "http://localhost:5173"
# Password-reset links come back to /reset-password on the address they were asked from.
# Live project (Dashboard → Authentication → URL Configuration): Site URL https://app.hotzonex.net,
# Redirect URLs https://app.hotzonex.net/** and https://hotzonex-cloud-rum4d.ondigitalocean.app/**.
additional_redirect_urls = ["http://localhost:5173/**"]
# Public email sign-up in Supabase Auth stays off. Staff accounts are made by owners (create-staff);
# new businesses sign up on the /signup page, which creates the owner's login through the signup
# Edge Function with the service role.
enable_signup = false

[auth.email]
enable_signup = false
enable_confirmations = false

# add-router and create-staff require a logged-in user; they then check the caller is an active admin.
[functions.add-router]
verify_jwt = true

[functions.create-staff]
verify_jwt = true

# Called by the MikroTik routers themselves, which have no user login: each router
# authenticates with the token from its setup script (checked inside the function).
[functions.router-gateway]
verify_jwt = false

# Woken by the database (pg_net) for routers connected by IP address; it checks the
# x-hzc-worker secret from app_config itself.
[functions.router-direct]
verify_jwt = false

# Login-portal pages, downloaded by the routers themselves (no user login; public page content only).
[functions.portal]
verify_jwt = false

[functions.tunnel]
verify_jwt = false

[functions.delete-items]
verify_jwt = true

# The owner's MTN MoMo API login (save / test / remove); it then checks the caller is an active admin.
[functions.momo]
verify_jwt = true

# Telegram updates and the database (pg_net) call it; it checks their secrets itself, and admins' logins for link/test/unlink.
[functions.alerts]
verify_jwt = false

# The public Buy page (customers have no login); it limits requests itself. Its "momo_sweep"
# action is called by the database (pg_net) and checks the x-hzc-worker secret itself.
[functions.buy]
verify_jwt = false

# Public self sign-up (no login yet); it limits sign-ups per device itself.
[functions.signup]
verify_jwt = false

# Hotzonex Cloud's own email designs (brand blue, logo). Local development reads these files; on the
# live project paste each file into Authentication → Email Templates (same subject).
[auth.email.template.confirmation]
subject = "Welcome to Hotzonex Cloud"
content_path = "./supabase/templates/confirmation.html"

[auth.email.template.recovery]
subject = "Reset your password"
content_path = "./supabase/templates/recovery.html"

[auth.email.template.email_change]
subject = "Confirm your new email"
content_path = "./supabase/templates/email_change.html"
