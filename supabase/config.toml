# Supabase CLI configuration for local development (`supabase start`).
# Only values that differ from the CLI defaults are listed.
project_id = "hotzonex-cloud"

[api]
schemas = ["public"]

[db]
major_version = 15

[auth]
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173"]
# Staff accounts are created by admins only; nobody can sign themselves up.
enable_signup = false

[auth.email]
enable_signup = false
enable_confirmations = false

# Both Edge Functions require a logged-in user; they then check the caller is an active admin.
[functions.add-router]
verify_jwt = true

[functions.create-staff]
verify_jwt = true
