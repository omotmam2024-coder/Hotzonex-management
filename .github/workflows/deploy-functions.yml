# Deploys the Supabase Edge Functions (supabase/functions) whenever code reaches the deploy branch,
# so nobody has to install the Supabase CLI. The website itself is redeployed by DigitalOcean from
# the same branch (.do/app.yaml, deploy_on_push).
#
# One-time setup: a Supabase access token as the repository secret SUPABASE_ACCESS_TOKEN
# (supabase.com → Account → Access Tokens; GitHub → Settings → Secrets and variables → Actions).
# Each function's login setting (verify_jwt) comes from supabase/config.toml.
# Run it by hand from the Actions tab too ("Deploy Edge Functions" → Run workflow).
name: Deploy Edge Functions

on:
  push:
    branches: [claude/clever-mccarthy-1780c7]
    paths:
      - 'supabase/functions/**'
      - 'supabase/config.toml'
      - '.github/workflows/deploy-functions.yml'
  workflow_dispatch:

# One deploy at a time; a newer push waits for the running one instead of racing it.
concurrency:
  group: deploy-functions
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: tyiwnaxdejtsdofgnuow
    steps:
      - uses: actions/checkout@v4

      - name: Check the access token is set
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Add the repository secret SUPABASE_ACCESS_TOKEN (see the top of this file)."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Server tests (nothing is deployed if they fail)
        run: node --test --experimental-strip-types supabase/functions/_shared/*.test.ts

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy every function
        # --yes: the CLI asks for confirmation before deploying, and nobody can answer it here.
        run: supabase functions deploy --project-ref "$PROJECT_REF" --use-api --yes
